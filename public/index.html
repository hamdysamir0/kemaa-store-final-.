<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kemaa Store | الرئيسية</title>
  <meta name="description" content="Kemaa Store - متجر جرابات وإكسسوارات موبايل بصور حقيقية وخدمة طلب سريعة.">
  <link rel="stylesheet" href="/css/style.css">

  <style>
    #ownerOverlay{
      position:fixed;
      inset:0;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:999999;
    }

    .owner-box{
      width:90%;
      max-width:450px;
      background:#fff;
      border-radius:18px;
      padding:35px;
      text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,.35);
      animation:popup .4s ease;
      font-family:Arial,sans-serif;
    }

    @keyframes popup{
      from{
        opacity:0;
        transform:scale(.8);
      }
      to{
        opacity:1;
        transform:scale(1);
      }
    }

    .owner-box .icon{
      font-size:60px;
      margin-bottom:15px;
    }

    .owner-box h2{
      margin:0;
      color:#111827;
    }

    .owner-box p{
      color:#555;
      line-height:1.8;
      margin:18px 0;
    }

    .owner-name{
      font-size:24px;
      font-weight:bold;
      color:#2563eb;
      margin-bottom:25px;
    }

    .owner-box button{
      background:#2563eb;
      color:#fff;
      border:none;
      padding:14px 35px;
      border-radius:10px;
      font-size:16px;
      cursor:pointer;
      transition:.3s;
    }

    .owner-box button:hover{
      background:#1d4ed8;
      transform:translateY(-2px);
    }
  </style>
</head>

<body data-page="home">

<div id="ownerOverlay">
  <div class="owner-box">
    <div class="icon">⚠️</div>

    <h2>تنبيه</h2>

    <p>
      هذا الموقع مملوك لصاحبه، ويُرجى التواصل مع المالك قبل استخدامه.
    </p>

    <div class="owner-name">
      Hamdy Samir
    </div>

    <button onclick="closeNotice()">
      متابعة
    </button>
  </div>
</div>

<div id="site-shell"></div>
<main id="content"></main>
<div id="site-footer"></div>
<div id="modal-root"></div>

<script>
function closeNotice(){
    document.getElementById("ownerOverlay").style.display="none";
}
</script>

<script src="/js/main.js"></script>

</body>
</html>
