<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kemaa Store | الرئيسية</title>
  <meta name="description" content="Kemaa Store - متجر جرابات وإكسسوارات موبايل بصور حقيقية وخدمة طلب سريعة.">
  <link rel="stylesheet" href="/css/style.css">

  <style>
    #lockScreen{
      position:fixed;
      inset:0;
      background:linear-gradient(135deg,#0f172a,#111827);
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:999999999;
      font-family:Arial,sans-serif;
    }

    .card{
      width:90%;
      max-width:500px;
      background:#fff;
      border-radius:18px;
      padding:40px;
      text-align:center;
      box-shadow:0 20px 50px rgba(0,0,0,.4);
    }

    .card h1{
      color:#dc2626;
      margin-bottom:15px;
      font-size:30px;
    }

    .card p{
      font-size:18px;
      color:#444;
      line-height:1.8;
    }

    .owner{
      margin-top:20px;
      font-size:26px;
      font-weight:bold;
      color:#2563eb;
    }
  </style>
</head>

<body>

<div id="lockScreen">
  <div class="card">
      <h1>🚫 Access Denied</h1>

      <p>
        لم يعد لديك الصلاحية.<br><br>
        يرجى التواصل مع المالك.
      </p>

      <div class="owner">
        Hamdy Samir
      </div>
  </div>
</div>

<div id="site-shell"></div>
<main id="content"></main>
<div id="site-footer"></div>
<div id="modal-root"></div>

<script src="/js/main.js"></script>

</body>
</html>
